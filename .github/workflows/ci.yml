name: CI

# Runs on every pull request. The dev-build workflow calls it for pushes to
# main, so main is never built twice, and release.yml for version tags.
# The Android APK is built only for those (merges to main and releases),
# not for pull requests.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version a release builds (release.yml); empty for a dev build
        type: string
        required: false
        default: ''
    outputs:
      apk_artifact:
        description: Name of the uploaded debug APK artifact
        value: ${{ jobs.android.outputs.artifact }}
      version_name:
        description: Version name baked into the APK
        value: ${{ jobs.android.outputs.version_name }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slavian
          POSTGRES_PASSWORD: slavian
          POSTGRES_DB: slavian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://slavian:slavian@localhost:5432/slavian_test

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start server + database
        run: docker compose -f ops/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST -H 'content-type: application/json' -d '{"displayName":"CI"}' http://localhost:8080/v1/auth/guest
      - name: Server logs
        if: always()
        run: docker compose -f ops/docker-compose.yml logs server

  client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translations up to date
        run: python3 tools/i18n/extract.py --check
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - run: ops/ci/install-godot.sh
      - name: Import project
        run: godot --headless --path client --import
      - name: Run tests
        run: godot --headless --path client --script res://tests/test_runner.gd
      - name: Smoke-run main scene
        run: godot --headless --path client --quit-after 30

  android:
    name: Android debug APK
    needs: [server, client]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-android-${{ env.GODOT_VERSION }}
      - run: ops/ci/install-godot.sh --android

      - name: Version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          base=$(sed -n 's/^config\/version="\(.*\)"/\1/p' client/project.godot)
          sha=$(git rev-parse --short HEAD)
          # Minutes since 2026-01-01: always increasing, so every build installs over the last one.
          code=$(( ($(date +%s) - 1767225600) / 60 ))
          name="${base}-dev.${sha}"
          # A release (release.yml: its version, or a pushed tag) builds that
          # version: it wins over config/version, so the game shows the
          # version it was released as.
          release="$RELEASE_VERSION"
          if [[ -z "$release" && "$GITHUB_REF" == refs/tags/v* ]]; then
            release="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$release" ]]; then
            name="$release"
            if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::v$name is not a version like v1.2.3"
              exit 1
            fi
            if [[ "$name" != "$base" ]]; then
              echo "::warning::Version $name differs from config/version $base in client/project.godot; building $name. Bump config/version on main."
              sed -i "s|^config/version=.*|config/version=\"$name\"|" client/project.godot
            fi
          fi
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "artifact=slavian-${name}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_DEBUG_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; using a throwaway key. Builds signed with different keys cannot be installed over each other."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=${KEYSTORE_USER:-androiddebugkey}"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=${KEYSTORE_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

      - name: Export APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ops/export-android.sh "build/${{ steps.version.outputs.artifact }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: build/${{ steps.version.outputs.artifact }}.apk
          retention-days: 7
          if-no-files-found: error
