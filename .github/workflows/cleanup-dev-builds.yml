name: Clean up dev builds

# Deletes dev pre-releases (tags starting with "dev-") older than
# max_age_days, together with their tags, and CI run artifacts older than
# that (they also expire on their own: retention-days: 7). Run by hand with
# "everything" to delete every dev build and artifact at once.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Delete dev builds older than this many days
        default: "7"
      everything:
        description: Delete every dev build and artifact, whatever its age
        type: boolean
        default: false
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old dev releases
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
          EVERYTHING: ${{ inputs.everything || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          cutoff=$(date -u -d "-${MAX_AGE_DAYS} days" +%s)
          if [ "$EVERYTHING" = "true" ]; then cutoff=$(date -u +%s); fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.tag_name | startswith("dev-"))) | "\(.created_at) \(.tag_name)"' \
            | sort -r > dev-releases.txt
          echo "Found $(wc -l < dev-releases.txt) dev release(s); cutoff $(date -u -d "@$cutoff" +%FT%TZ)"

          deleted=0
          while read -r created tag; do
            if [ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]; then
              echo "Keeping: $tag ($created)"
              continue
            fi
            echo "Deleting: $tag ($created)"
            if [ "$DRY_RUN" != "true" ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
            deleted=$((deleted + 1))
          done < dev-releases.txt
          echo "Deleted $deleted dev release(s) older than $MAX_AGE_DAYS days (dry run: $DRY_RUN)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete old CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
          EVERYTHING: ${{ inputs.everything || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          cutoff=$(date -u -d "-${MAX_AGE_DAYS} days" +%s)
          if [ "$EVERYTHING" = "true" ]; then cutoff=$(date -u +%s); fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.created_at) \(.id) \(.name)"' > artifacts.txt
          deleted=0
          while read -r created id name; do
            if [ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]; then
              continue
            fi
            echo "Deleting artifact: $name ($created)"
            if [ "$DRY_RUN" != "true" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
            deleted=$((deleted + 1))
          done < artifacts.txt
          echo "Deleted $deleted artifact(s) (dry run: $DRY_RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
