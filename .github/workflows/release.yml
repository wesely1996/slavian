name: Release

# Pushing a version tag (v0.1.0) that matches config/version in
# client/project.godot runs CI on the tagged commit, then publishes the APK
# as a GitHub release (not a pre-release, so cleanup-dev-builds.yml keeps
# it) and the server image as ghcr.io/<owner>/slavian-server:<version>.
#   git tag v0.1.0 origin/main && git push origin v0.1.0
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.apk_artifact }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.ci.outputs.version_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Slavian ${VERSION_NAME}" \
            --generate-notes
          echo "Published [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: Publish server image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slavian-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
