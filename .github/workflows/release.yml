name: Release

# Pushing a version tag (v0.1.0), or making a release in GitHub's UI (with
# immutable releases on, that release can't get the APK attached), runs
# CI on the tagged commit (building the tag's version; bump config/version in
# client/project.godot on main to match), then publishes the APK
# as a GitHub release (not a pre-release, so cleanup-dev-builds.yml keeps
# it) and the server image as ghcr.io/<owner>/slavian-server:<version>,
# then deploys that version to the production server (job "deploy").
#   git tag v0.1.0 origin/main && git push origin v0.1.0
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.apk_artifact }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.ci.outputs.version_name }}
        run: |
          # A release made by hand in GitHub's UI (which also makes the tag)
          # gets the APK added; otherwise the release is made here. With
          # immutable releases on, a published release takes no more files:
          # the APK stays in this run's artifacts and the deploy goes ahead.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release upload "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "::warning::Could not add the APK to release $GITHUB_REF_NAME (immutable once published). Push the tag instead of making the release in GitHub's UI; the APK is in this run's artifacts."
              echo "APK not attached to [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME): it is in this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Slavian ${VERSION_NAME}" \
              --generate-notes
          fi
          echo "Published [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: Publish server image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slavian-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the release on the production server (ops/production/deploy.sh),
  # once its image is published (the APK's release page doesn't hold it up).
  # The SSH key may run only that script.
  # Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (docs/production.md).
  deploy:
    name: Deploy to production
    needs: server-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Deploy ${{ github.ref_name }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_SSH_KEY are not set; skipping the deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" "$GITHUB_REF_NAME"
          echo "Deployed $GITHUB_REF_NAME to $DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
