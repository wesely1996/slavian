name: Release

# Makes a release: CI on the release's commit (building its version; bump
# config/version in client/project.godot on main to match), then the APK
# published as a GitHub release (not a pre-release, so
# cleanup-dev-builds.yml keeps it) with the APK attached, the server image
# as ghcr.io/<owner>/slavian-server:<tag>, and that version deployed to the
# production server (job "deploy"). Either:
#   - Actions > Release > Run workflow on main (the version defaults to
#     config/version): the workflow makes the tag and the release itself;
#   - or push a tag: git tag v0.1.0 origin/main && git push origin v0.1.0
# Don't make the release in GitHub's UI: with immutable releases on, a
# published release takes no more files, so the APK can't be attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.5.2 (empty takes config/version in client/project.godot)
        required: false
        default: ''

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release's tag: the one pushed, or (run from the button) v<version>,
  # made here on the commit the workflow runs on. A tag pushed with the
  # workflow's own token starts no second run.
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ -z "$version" ]]; then
              version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' client/project.godot)
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$version is not a version like 1.2.3"
              exit 1
            fi
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists; bump config/version (or give another version) for a new release."
              exit 1
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [tag, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.apk_artifact }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION_NAME: ${{ needs.ci.outputs.version_name }}
        run: |
          # Made here, with the APK on it (gh uploads it to a draft, then
          # publishes, so immutable releases keep it). A draft made by hand
          # in GitHub's UI on this tag gets the APK, then is published. A
          # release already published by hand takes no more files: the APK
          # stays in this run's artifacts and the deploy goes ahead.
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if ! gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "::warning::Could not add the APK to release $TAG: it was published by hand in GitHub's UI and is immutable. Next time use Actions > Release > Run workflow (or push the tag) and let the workflow make the release. The APK is in this run's artifacts."
              echo "APK not attached to [$TAG]($url): it was published by hand and is immutable. It is in this run's artifacts; next time use Actions > Release > Run workflow." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$draft" == "true" ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Slavian ${VERSION_NAME}" \
              --generate-notes
          fi
          echo "Published [$TAG]($url) with the APK" >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: Publish server image
    needs: [tag, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slavian-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the release on the production server (ops/production/deploy.sh),
  # once its image is published (the APK's release page doesn't hold it up).
  # The SSH key may run only that script.
  # Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (docs/production.md).
  deploy:
    name: Deploy to production
    needs: [tag, server-image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Deploy ${{ needs.tag.outputs.tag }}
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_SSH_KEY are not set; skipping the deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" "$TAG"
          echo "Deployed $TAG to $DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
