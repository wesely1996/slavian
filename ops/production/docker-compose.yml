# Production (PLAN.md M5 step 17; docs/production.md): the game server from
# the image CI publishes on every merge to main, Caddy in front of it for
# HTTPS on your domain (certificates are fetched and renewed by themselves),
# Postgres on this machine, a nightly database backup and its copy off the
# machine. COMPOSE_PROFILES in .env picks the optional parts: `local-db`
# (Postgres here; without it DATABASE_URL points at a hosted one such as
# Neon) and `offsite` (backups copied to S3-compatible storage such as
# Cloudflare R2). Moving an existing Neon database here: move-db.sh.
#   cp .env.example .env   # then fill it in
#   docker compose -f ops/production/docker-compose.yml up -d
#   docker compose -f ops/production/docker-compose.yml pull && docker compose -f ops/production/docker-compose.yml up -d   # update
name: slavian

services:
  server:
    image: ghcr.io/wesely1996/slavian-server:${SLAVIAN_TAG:-main}
    env_file: .env
    environment:
      PORT: "8080"
    volumes:
      # The Firebase service-account key (docs/push.md), kept out of the
      # image; push is on once .env sets FCM_SERVICE_ACCOUNT_FILE.
      - ./fcm.json:/run/secrets/fcm.json:ro
      # The month's costs (site/costs.json), edited here without a redeploy.
      - ./costs.json:/app/site/costs.json:ro
    # With the local database, the server starts once it accepts connections.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2.10
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

  # Every night: a pg_dump of the database into ./backups, the last
  # BACKUP_KEEP_DAYS kept. Its tools match the database's major version.
  backup:
    image: postgres:${POSTGRES_VERSION:-17}
    env_file: .env
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Profile local-db: Postgres on this machine
  # (DATABASE_URL=postgres://slavian:<POSTGRES_PASSWORD>@postgres:5432/slavian).
  # Only the other services reach it: no port is opened to the internet.
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    profiles: [local-db]
    environment:
      POSTGRES_USER: slavian
      # Postgres refuses to start without one (move-db.sh makes it).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: slavian
    # Sized for the smallest machine (1 GB of memory, with swap) shared with
    # the game server; raise both on a bigger one (a quarter and half of it).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=256MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slavian -d slavian"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Profile offsite: an hour after each backup, the backups copied to
  # S3-compatible storage (offsite.sh), so they outlive this machine.
  offsite:
    image: rclone/rclone:1.68
    profiles: [offsite]
    env_file: .env
    volumes:
      - ./backups:/backups:ro
      - ./offsite.sh:/offsite.sh:ro
    entrypoint: ["sh", "/offsite.sh"]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  pgdata:
